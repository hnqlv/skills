<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 452" font-family="ui-monospace, Menlo, monospace" font-size="14">
  <defs>
    <pattern id="empty" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#1b1d23"/>
      <rect width="2" height="8" fill="#272b34"/>
    </pattern>
  </defs>

  <text x="24" y="38" font-size="18" fill="#d7dae0">1. A lookup asks the vendor only on a miss</text>

  <text x="24" y="72" fill="#e0a458">miss</text>
  <rect x="24" y="84" width="132" height="24" fill="#234a7d"/>
  <text x="34" y="101" fill="#cfe3ff">request 87110</text>
  <rect x="24" y="110" width="132" height="24" fill="url(#empty)"/>
  <rect x="24" y="136" width="132" height="24" fill="url(#empty)"/>
  <rect x="24" y="162" width="132" height="24" fill="url(#empty)"/>
  <rect x="176" y="84" width="132" height="24" fill="url(#empty)"/>
  <rect x="176" y="110" width="132" height="24" fill="#1f222a"/>
  <text x="186" y="127" fill="#c9cdd4">10001<tspan x="242">8.875%</tspan></text>
  <rect x="176" y="136" width="132" height="24" fill="#1f222a"/>
  <text x="186" y="153" fill="#c9cdd4">60601<tspan x="242">10.25%</tspan></text>
  <rect x="176" y="162" width="132" height="24" fill="#5a431c"/>
  <text x="186" y="179" fill="#f5d9a8">87110<tspan x="242">7.81%</tspan></text>
  <polygon points="156,84 176,162 176,186 156,108" fill="#e0a458" opacity="0.45"/>
  <text x="24" y="214" fill="#e0a458">Not saved. Ask the vendor once,</text>
  <text x="24" y="234" fill="#e0a458">then save the row.</text>

  <text x="332" y="72" fill="#7fd49e">hit</text>
  <rect x="332" y="84" width="132" height="24" fill="#234a7d"/>
  <text x="342" y="101" fill="#cfe3ff">request 87110</text>
  <rect x="332" y="110" width="132" height="24" fill="url(#empty)"/>
  <rect x="332" y="136" width="132" height="24" fill="url(#empty)"/>
  <rect x="332" y="162" width="132" height="24" fill="url(#empty)"/>
  <rect x="484" y="84" width="132" height="24" fill="url(#empty)"/>
  <rect x="484" y="110" width="132" height="24" fill="#1f222a"/>
  <text x="494" y="127" fill="#c9cdd4">10001<tspan x="550">8.875%</tspan></text>
  <rect x="484" y="136" width="132" height="24" fill="#1f222a"/>
  <text x="494" y="153" fill="#c9cdd4">60601<tspan x="550">10.25%</tspan></text>
  <rect x="484" y="162" width="132" height="24" fill="#234a7d"/>
  <text x="494" y="179" fill="#cfe3ff">87110<tspan x="550">7.81%</tspan></text>
  <polygon points="464,84 484,162 484,186 464,108" fill="#7ab0f5" opacity="0.45"/>
  <text x="332" y="214" fill="#7fd49e">Saved already.</text>
  <text x="332" y="234" fill="#7fd49e">No vendor call.</text>

  <text x="24" y="292" font-size="18" fill="#d7dae0">2. What each lookup costs</text>

  <rect x="24" y="317" width="56" height="14" fill="#234a7d"/>
  <text x="96" y="329" fill="#c9cdd4">saved row: every later lookup</text>
  <text x="520" y="329" fill="#7fd49e">free</text>
  <rect x="24" y="345" width="56" height="14" fill="#5a431c"/>
  <text x="96" y="357" fill="#c9cdd4">vendor call: one per zip per month</text>
  <text x="520" y="357" fill="#e0a458">paid</text>
  <rect x="24" y="373" width="56" height="14" fill="#5a2528"/>
  <text x="96" y="385" fill="#c9cdd4">no rate and no key</text>
  <text x="520" y="385" fill="#f07f7f">refused</text>

  <text x="24" y="424" fill="#7d828c">The rate rows are examples. The real table has one row per zip.</text>
</svg>
